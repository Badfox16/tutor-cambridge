# Perfis de run. Uso:  python -m harness.run --profile <nome>
# Todo perfil herda [default]; qualquer flag da CLI (--model, --limit...) sobrepõe.
# Mude UMA coisa por vez entre runs e descreva-a em --notes.
#
# Máquina: MX250 com 2 GB de VRAM. Modelos de ~6 GB rodam quase todo na CPU
# (lento: ~4 tok/s, cold start ~90 s). Por isso limit baixo e num_ctx 4096.

[default]
model = "gemma4:e4b"        # tag exata do Ollama (ollama list); ~2x mais rápido que o qwen aqui
prompt = "marker-compact"   # arquivo em prompts/ (sem .txt)
think = "off"               # "on" = modo raciocínio (bem mais lento)
temperature = 0.2
num_ctx = 4096
max_tokens = 1024
keep_alive = "10m"          # mantém o modelo carregado entre respostas
repeats = 1
limit = 5                   # respostas por run, espalhadas por todas as questões (0 = todas)
question = ""               # ex.: "dens-001" para só uma questão

[qwen]
model = "qwen3.5:9b"

[full-prompt]
prompt = "marker-full"

[rules]
prompt = "marker-rules"   # convenções gerais da Cambridge contra o viés negativo

[thinking]
think = "on"
max_tokens = 2048

[points]
prompt = "marker-points"  # compact + "judge each point on its own" (extra points beyond the cap)
post = "numeric,a1check,subst,implied,sum"
temperature = 0.0
